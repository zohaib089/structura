services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: structuradb
      POSTGRES_USER: structura
      POSTGRES_PASSWORD: structura123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: structura
      DB_PASSWORD: structura123
      DB_NAME: structuradb
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Structura <no-reply@structura.local>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - '4100:4100'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./apps/web
    environment:
      API_PROXY_TARGET: http://api:4100
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
