# PR architecture check (roadmap R5).
#
# Scans the pull request with Atlasmith (`scan --strict-architecture`, impact
# depth 3) and keeps ONE plain-English comment on the PR up to date. The scan
# and comment steps live in the reusable composite action
# .github/actions/atlasmith-check (see docs/pr-check-action.md and
# docs/engineering/pr-check.md).
#
# Fork safety:
# - Trigger is `pull_request`, never `pull_request_target`. PR code only ever runs
#   with the read-only token GitHub gives `pull_request` runs.
# - The `scan` job checks out and runs PR code (it builds the CLI from this
#   checkout) with `contents: read` only. It hands the rendered Markdown to the
#   next job as a base64 job output. No artifact actions, no third-party actions,
#   no secrets.
# - The `comment` job holds `pull-requests: write`. It sparse-checks out only
#   `.github/actions/atlasmith-check` (so the local action can be loaded), with
#   persist-credentials: false, and runs that action in comment-only mode: no
#   install, build, or scan. It posts the text with the GITHUB_TOKEN.
# - For fork PRs (and Dependabot) the token is read-only, so `comment` is skipped
#   and the same text is written to the scan job summary instead.
# - Everything runs on the GitHub-hosted runner. No source text leaves it; only
#   the rendered comment (paths, module names, line numbers) is posted.
#
# Free tier only: standard GitHub-hosted runners.
name: PR architecture check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan and render comment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      comment_b64: ${{ steps.check.outputs.comment_b64 }}
    steps:
      # Default ref is the PR merge commit, so HEAD^1 is the current base tip and
      # the diff is exactly what merging would change. Depth 2 covers both.
      # This checkout is also required so the local composite action can be loaded.
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Scan with Atlasmith
        id: check
        uses: ./.github/actions/atlasmith-check
        with:
          strictness: "true"
          impact-depth: "3"
          fail-on-findings: "true"
          checkout: "false"
          post-comment: "false"
          cli-source: workspace

  comment:
    name: Post sticky comment
    needs: scan
    # Skipped for forks and Dependabot: their token is read-only. The text is in the scan job summary.
    if: >-
      !cancelled()
      && needs.scan.outputs.comment_b64 != ''
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Local composite actions are loaded from the workspace, so this job needs
      # a checkout. Only the action files are fetched (sparse), credentials are
      # not persisted, and the action runs in comment-only mode: no install,
      # build, or scan, and no application source is used.
      - name: Check out the action only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/actions/atlasmith-check
          sparse-checkout-cone-mode: true

      - name: Create or update the comment
        uses: ./.github/actions/atlasmith-check
        with:
          comment-b64: ${{ needs.scan.outputs.comment_b64 }}
          post-comment: "true"
          checkout: "false"
          fail-on-findings: "false"
